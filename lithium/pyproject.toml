[project]
name = "lithos"
version = "0.1.0"
description = "Research prototype: Bayesian lithium dosing and monitoring engine"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
sim = ["matplotlib>=3.7"]
test = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
